name: Update contribution calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions: {}

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Render calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          user: yaaggo
          filename: isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: yes
          config_timezone: America/Bahia
      - name: Copy rendered calendar
        run: sudo cp /metrics_renders/isocalendar.svg "$RUNNER_TEMP/isocalendar.svg"
      - name: Upload calendar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calendar
          path: ${{ runner.temp }}/isocalendar.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: calendar
          path: ${{ runner.temp }}/calendar
      - name: Validate and copy calendar
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          source = Path(os.environ['RUNNER_TEMP']) / 'calendar' / 'isocalendar.svg'
          data = source.read_bytes()
          if len(data) > 2_000_000 or ET.fromstring(data).tag != '{http://www.w3.org/2000/svg}svg':
              raise ValueError('Invalid calendar SVG')
          Path('assets/isocalendar.svg').write_bytes(data)
          PY
      - name: Commit calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/isocalendar.svg && test -z "$(git ls-files --others --exclude-standard -- assets/isocalendar.svg)"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/isocalendar.svg
          git commit -m 'Update contribution calendar'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
